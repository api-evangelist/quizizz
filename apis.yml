  detail: >-
    Wayground publishes no OpenAPI, GraphQL SDL, AsyncAPI, WSDL or .proto and runs no developer
    portal, but STEP 0b contract discovery found a real, undocumented remote MCP server -
    https://wayground.com/_quizizzmcp/main/mcp - declared by the provider's own RFC 9728
    /.well-known/oauth-protected-resource document and fronted by a complete OAuth 2.1
    authorization server. Four verbatim provider documents were captured. The MCP tool list could
    not be enumerated: the endpoint answers anonymous JSON-RPC with a CloudFront 403 rather than
    an OAuth 401 challenge.
