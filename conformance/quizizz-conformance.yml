domain_standards:
- id: lti-1.3
  name: 1EdTech Learning Tools Interoperability 1.3
  conforms: true
  declared_in: docs
  evidence: >-
    Wayground publishes administrator guides for integrating as an LTI tool with Canvas,
    Schoology, Blackboard and Moodle, including deep linking of activities and automatic grade
    passback to the LMS gradebook. Per-institution client IDs and a JSON configuration URL are
    generated at https://wayground.com/lti/admin/canvas/integration.
  source: https://help.wayground.com/support/solutions/articles/158000403884-integrate-wayground-with-canvas-via-lti-as-an-administrator
  caveat: >-
    This is a documentation claim, not a contract declaration. Wayground serves no publicly
    fetchable LTI tool configuration JSON and no JWKS URL - /lti/config.json, /lti/keys and
    /lti/.well-known/jwks.json all return the single-page-app HTML shell (HTTP 200, text/html),
    which is a miss, not a document. A platform administrator must generate the configuration
    from an authenticated Wayground admin screen.
