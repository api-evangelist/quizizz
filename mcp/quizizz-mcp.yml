note: >-
  This is a real, provider-operated remote MCP server that Wayground does not document anywhere
  a human or a search engine can find it. Nothing on wayground.com, help.wayground.com,
  support.wayground.com or github.com/quizizz mentions it; it was found only because Wayground
  correctly serves the RFC 9728 protected-resource document that MCP clients are supposed to
  read. The auth posture is modern and complete - OAuth 2.1, public clients, PKCE S256, dynamic
  client registration, refresh tokens, resource indicators - which is the posture of a
  deliberately built agent surface rather than an accident.
  What is NOT recorded here, because it could not be observed: the tool list, tool input schemas,
  the transport (streamable HTTP vs SSE), and the protocol version. Those require an
  authenticated introspection with a registered client and a Wayground account. No tool list has
  been derived or guessed - Wayground publishes no OpenAPI from which one could be derived, and
  inventing one would misrepresent what an agent can actually call.
gaps:
- No public documentation, quickstart, or connector listing for the MCP server.
- tools/list is unreachable anonymously (CloudFront 403 rather than a 401 OAuth challenge).
- >-
  The endpoint answers a bare 403 instead of a 401 with a WWW-Authenticate header pointing at
  the resource metadata, which is what RFC 9728 clients expect for discovery.
