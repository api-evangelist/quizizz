  name: 1EdTech TrustEd Apps data privacy certification
  conforms: true
  declared_in: docs
  evidence: '"TrustEd Apps Certified Data Privacy badge from 1EdTech" listed on the Privacy Center.'
  source: https://wayground.com/home/privacy-center
