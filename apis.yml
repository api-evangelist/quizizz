apis:
- name: Wayground MCP Server
  description: >-
    Remote Model Context Protocol server operated by Wayground at
    https://wayground.com/_quizizzmcp/main/mcp. Its existence is declared by Wayground's own
    /.well-known/oauth-protected-resource document, which names the endpoint as the protected
    resource and https://wayground.com as its authorization server. The endpoint itself is
    fronted by CloudFront and returns 403 to anonymous, unauthenticated clients, so the tool
    list could not be enumerated. Wayground publishes no human documentation for it.
  humanURL: https://wayground.com/home/integrations
  baseURL: https://wayground.com/_quizizzmcp/main/mcp
