standards:
- id: oauth2
  conforms: true
  evidence: >-
    /.well-known/oauth-authorization-server publishes an RFC 8414 metadata document: issuer,
    authorization/token/registration/revocation endpoints, grant_types [authorization_code,
    refresh_token], response_types [code].
  source: https://wayground.com/.well-known/oauth-authorization-server
- id: oauth2.1
  conforms: true
  evidence: >-
    Authorization-code-only, PKCE S256 required, public clients with token_endpoint_auth_methods
    ["none"], refresh tokens, resource indicators - the OAuth 2.1 profile, not legacy 2.0.
  source: https://wayground.com/.well-known/oauth-authorization-server
- id: rfc7591-dynamic-client-registration
  conforms: true
  evidence: registration_endpoint https://wayground.com/_authserver/public/public/v1/oauth/register
  source: https://wayground.com/.well-known/oauth-authorization-server
- id: rfc9728-protected-resource-metadata
  conforms: true
  evidence: >-
    /.well-known/oauth-protected-resource returns {resource, authorization_servers,
    scopes_supported} naming the MCP endpoint. This is the discovery document MCP clients read.
  source: https://wayground.com/.well-known/oauth-protected-resource
- id: rfc8707-resource-indicators
  conforms: true
  evidence: resource_indicators_supported = true
  source: https://wayground.com/.well-known/oauth-authorization-server
- id: oidc
  conforms: false
  evidence: >-
