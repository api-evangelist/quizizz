    handshake, but Wayground publishes no static OIDC or LTI configuration document for it.
  source: https://wayground.com/.well-known/openid-configuration
- id: mcp
  conforms: true
  evidence: >-
    A remote Model Context Protocol endpoint is declared by the provider's own protected-resource
