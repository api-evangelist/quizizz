aid: quizizz
name: Wayground
description: >-
  Wayground (formerly Quizizz) is a K-12 supplemental learning platform from Santa Monica,
  California that blends instruction, practice and assessment with AI generation. Teachers
  build and run quizzes, lessons, flashcards, worksheets and video activities; administrators
  get school and district dashboards, rostering and grade sync. The company reports use in
  over 150 countries and by 90% of U.S. schools. Its integration surface is aimed at learning
  platforms rather than at general developers - LTI embedding into Canvas, Schoology,
  Blackboard and Moodle, rostering and SSO through Clever, ClassLink and Google Classroom,
  and automatic grade passback. Wayground publishes no public REST API or developer portal,
  but it does operate an undocumented remote Model Context Protocol server, declared by its
  own /.well-known/oauth-protected-resource document and fronted by a full OAuth 2.1
  authorization server with dynamic client registration and PKCE.
